[package]
name = "calcit_fswatch"
version = "0.0.8"
authors = ["jiyinyiyong <jiyinyiyong@gmail.com>"]
edition = "2024"

[lib]
name = "calcit_fswatch"
path = "src/lib.rs"
crate-type = ["cdylib"] # Stable C ABI only; do not expose Rust dependency symbols.


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
calcit_native_ffi = "0.1.3"
cirru_edn = "0.8.0"
cirru_parser = "0.2.4"
notify = "6.x"
