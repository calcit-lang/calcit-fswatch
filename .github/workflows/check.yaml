on:
  push:
    branches:
      - master
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: |
          caps --strict --ci
          caps verify --toolchain

      - run: cargo fmt -- --check

      - run: cargo test --locked

      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: cargo build --release --locked

      - run: mkdir -p dylibs/ && cp -v target/release/libcalcit_fswatch.* dylibs/

      - run: bash scripts/check-c-safe-ffi.sh

      - name: Validate Calcit snapshot
        run: |
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --strict-types --check-only
          calcit calcit.cirru analyze check-public --ns 'fswatch.$meta' --ns fswatch.core --ns fswatch.test --ns fswatch.util --format json
          calcit calcit.cirru analyze quality
          calcit calcit.cirru analyze dynamic-methods
          calcit calcit.cirru docs format-md README.md --check
          calcit calcit.cirru docs check-md README.md --failures-only

      - name: Run watcher smoke test
        shell: bash
        run: |
          mkdir -p sandbox
          set +e
          timeout 5s calcit --trace-ffi calcit.cirru 2>&1 | tee /tmp/fswatch-smoke.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 124
          grep -F 'fswatch_calcit_ffi_async_v1' /tmp/fswatch-smoke.log
