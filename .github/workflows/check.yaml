on:
  push:
    branches:
      - master
      - main
  pull_request: {}

name: Test

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: 0.1.1

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
          components: clippy,rustfmt
          cache: false

      - run: |
          caps --strict --ci
          caps verify --toolchain

      - run: cargo fmt -- --check

      - run: cargo test --locked

      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: bash build.sh

      - run: bash scripts/check-c-safe-ffi.sh

      - name: Validate Calcit snapshot
        run: |
          set -euo pipefail
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru --check-only --all-defs
          calcit calcit.cirru fix --workflow strict --verify --format json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit calcit.cirru --check-only --ns 'fswatch.$meta' --ns fswatch.core --ns fswatch.test --ns fswatch.util --summary-only --format json
          calcit calcit.cirru analyze weak-types --only dynamic-method
          calcit calcit.cirru docs format-md README.md --check
          calcit calcit.cirru docs check-md README.md --failures-only

      - name: Run watcher smoke test
        shell: bash
        run: |
          mkdir -p sandbox
          (
            for wave in 1 2 3 4; do
              sleep 1
              printf '%s\n' "$wave" > sandbox/ffi-event-smoke.txt
            done
          ) &
          writer_pid=$!
          set +e
          timeout 5s calcit --trace-ffi calcit.cirru 2>&1 | tee /tmp/fswatch-smoke.log
          status=${PIPESTATUS[0]}
          set -e
          wait "$writer_pid"
          test "$status" -eq 124
          grep -F 'fswatch_calcit_ffi_async_v1' /tmp/fswatch-smoke.log
          grep -F 'FswatchEvent' /tmp/fswatch-smoke.log | grep -F 'ffi-event-smoke.txt'
